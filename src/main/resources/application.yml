server:
  port: 5000

spring:
  application:
    name: viettoria-be

  datasource:
    url: jdbc:h2:file:./data/viettoria_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: viettoria-heritage-secret-key-2026-very-secure-and-long-token-for-signing-hmac-sha256
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
      - http://localhost:3000
